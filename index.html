<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miojo Store · Outfits</title>
<link rel="icon" href="logo/logo%20ico.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="abas" id="abas">
  <div class="abas-in">
    <span class="abas-marca"><img src="logo/logo%20ico.png" alt="">Miojo Store</span>
    <div class="abas-lista" role="tablist">
      <button data-aba="peds" class="ativa">Outfits Peds</button>
      <button data-aba="shop">Outfits Shop</button>
      <button data-aba="drawables">Drawables</button>
    </div>
  </div>
</nav>

<section class="hero">
  <h2>Miojo Store</h2>
  <div class="medalhao"><img src="logo/logo.png" alt="Logo Miojo Store"></div>
  <div class="sub-title">Outfits Store</div>
  <div class="count" id="total"></div>
</section>

<header>
  <div class="bar">
    <div class="brand">
      <h1>Miojo Store <small id="aba-nome">Outfits Peds</small></h1>
    </div>
    <input type="search" id="busca" placeholder="Buscar modelo ou outfit…" autocomplete="off">
    <select id="categoria"></select>
    <select id="ordem">
      <option value="nome">Nome (A–Z)</option>
      <option value="nome-desc">Nome (Z–A)</option>
    </select>
    <label class="size" title="Tamanho das miniaturas">
      <span>Tamanho</span>
      <input type="range" id="tamanho" min="200" max="560" step="20" value="300">
    </label>
    <div class="toggle" role="group" aria-label="Modo de exibição">
      <button id="btn-grade" class="active" title="Grade">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        Grade
      </button>
      <button id="btn-lista" title="Lista">
        <svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2.5" rx="1"/><rect x="1" y="6.75" width="14" height="2.5" rx="1"/><rect x="1" y="11.5" width="14" height="2.5" rx="1"/></svg>
        Lista
      </button>
    </div>
  </div>
</header>

<div class="info" id="info"></div>
<main>
  <div id="container" class="grid"></div>
  <div id="sentinel"></div>
</main>

<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <div class="cap">
      <div class="model" id="lb-model"></div>
      <div class="sub" id="lb-sub"></div>
    </div>
    <div class="actions">
      <button class="btn" data-copy="model">Copiar modelo</button>
      <button class="btn destaque" id="lb-full">Ver Outfit Full</button>
      <button class="btn" data-copy="outfit">Copiar nº do outfit</button>
      <button class="btn" data-copy="file">Copiar nome do arquivo</button>
      <a class="btn" id="lb-open" target="_blank" style="text-decoration:none">Abrir imagem</a>
      <button class="btn" id="lb-close">Fechar ✕</button>
    </div>
  </div>
  <div class="lb-body">
    <div class="lb-stage">
      <button class="lb-nav lb-prev" id="lb-prev" aria-label="Anterior">‹</button>
      <div class="lb-frame">
        <img id="lb-img" alt="">
        <div id="lb-marcadores"></div>
      </div>
      <button class="lb-nav lb-next" id="lb-next" aria-label="Próxima">›</button>
    </div>
    <aside class="lb-painel">
      <div class="painel-head">
        <h3 id="p-titulo"></h3>
        <div class="partes" id="p-partes"></div>
        <div class="actions">
          <button class="btn" id="p-copiar">Copiar XML</button>
        </div>
      </div>
      <div class="painel-body" id="p-body"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/imagens.js"></script>
<script src="js/app.js"></script>
</body>
</html>
